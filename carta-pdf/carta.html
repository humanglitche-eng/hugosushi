<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hugo Sushi — Carta</title>
<!--
  La carta de Hugo Sushi para imprimir o mandar en PDF, con el estilo de
  hugosushi.online. No se escribe a mano: `generar.js` le pasa el catálogo
  VIVO de la API (window.CARTA) y la imprime con Chromium. Así el PDF dice lo
  mismo que la página —nombres, descripciones, porciones y precios del día—
  y para actualizarlo alcanza con volver a generarlo.

  Las fotos son las de la página (../img/), las mismas ilustrativas: se
  aclara al pie. Si el dueño sube una propia desde su panel, esa manda.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
  /* Todas las hojas van a sangre y cada una es un bloque A4 con su fondo: con
     márgenes de @page, Chrome deja esas franjas en blanco. El reparto en hojas
     lo hace el script (ver `paginar`). */
  @page { size: A4; margin: 0; }

  :root{
    --bg:#0a0908; --bg2:#121110; --card:#171513; --ink:#f6f1ea;
    --dim:rgba(246,241,234,.64); --mute:rgba(246,241,234,.38);
    --line:rgba(246,241,234,.12); --rojo:#e44027; --rojo-2:#ff7a5c; --oro:#f0c36a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-weight:300;line-height:1.45;}
  img{display:block;max-width:100%;}
  .num{font-variant-numeric:tabular-nums;}
  .disp{font-family:'Russo One',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;}
  em{font-style:normal;color:var(--rojo);}
  .kicker{display:inline-flex;align-items:center;gap:3mm;font-size:8pt;font-weight:500;
    letter-spacing:.22em;text-transform:uppercase;color:var(--rojo-2);}
  .kicker::before{content:'';width:7mm;height:.6mm;background:var(--rojo);}

  /* ── Portada ── */
  .portada{width:210mm;height:297mm;position:relative;overflow:hidden;
    padding:18mm 16mm 16mm;display:flex;flex-direction:column;break-after:page;}
  .portada::before{content:'';position:absolute;left:50%;top:30%;width:260mm;height:220mm;
    transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(228,64,39,.28),transparent 72%);}
  .portada > *{position:relative;}
  .marca{display:flex;align-items:center;justify-content:space-between;}
  .marca img{height:13mm;border-radius:2mm;}
  .marca span{font-size:8pt;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);}
  .titulo{margin-top:16mm;}
  .titulo h1{font-size:46pt;font-weight:900;line-height:.95;letter-spacing:-.035em;margin-top:5mm;}
  .titulo p{margin-top:6mm;color:var(--dim);font-size:12pt;max-width:120mm;}
  .arte{position:relative;flex:1;margin:4mm -6mm 0;}
  .arte img{position:absolute;mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 56%,transparent 76%);
            mask-image:radial-gradient(circle at 50% 50%,#000 56%,transparent 76%);}
  .arte img:nth-child(1){width:58%;left:21%;top:0;z-index:3;}
  .arte img:nth-child(2){width:42%;left:0;top:34%;z-index:2;}
  .arte img:nth-child(3){width:44%;right:0;top:40%;z-index:1;}
  .pedir{display:grid;grid-template-columns:1fr auto;gap:8mm;align-items:center;
    border-top:1px solid var(--line);padding-top:7mm;}
  .pedir h2{font-size:15pt;}
  .pedir .datos{display:grid;gap:1.6mm;margin-top:3mm;font-size:10.5pt;color:var(--dim);}
  .pedir .datos b{color:var(--ink);font-weight:500;}
  .qr{background:#fff;border-radius:3mm;padding:3mm;width:34mm;height:34mm;}
  .qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
  .qr-cap{font-size:7.5pt;color:var(--mute);text-align:center;margin-top:2mm;letter-spacing:.06em;}

  /* ── Hojas de la carta ── */
  .hoja{width:210mm;height:297mm;overflow:hidden;padding:15mm 15mm 14mm;position:relative;
    background:var(--bg);break-after:page;}
  .hoja:last-child{break-after:auto;}
  .blk{margin-bottom:3.6mm;}
  .blk.sec-head{margin-top:8mm;margin-bottom:5mm;}
  .hoja > .blk:first-child{margin-top:0;}
  .sigue{font-size:8pt;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:4mm;}
  .folio{position:absolute;left:15mm;right:15mm;bottom:7mm;display:flex;justify-content:space-between;
    font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);}
  .sec-head h2{font-size:25pt;line-height:1;margin-top:2.5mm;}
  .sec-head p{color:var(--dim);font-size:9.5pt;max-width:130mm;margin-top:2.5mm;}
  .tira{display:inline-flex;gap:2.5mm;align-items:center;margin-top:3.5mm;font-size:9pt;font-weight:500;
    padding:1.4mm 3.6mm;border-radius:99px;border:1px solid rgba(228,64,39,.5);color:var(--rojo-2);}
  .grilla{display:grid;grid-template-columns:1fr 1fr;gap:3.6mm;}
  .plato{break-inside:avoid;display:grid;grid-template-columns:27mm 1fr;gap:3.5mm;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:3.5mm;padding:2.4mm 4mm 2.4mm 2.4mm;min-height:31mm;}
  .foto{width:27mm;height:27mm;position:relative;}
  .foto img{width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 56%,transparent 80%);
            mask-image:radial-gradient(circle at 50% 50%,#000 56%,transparent 80%);}
  .foto.sin{display:flex;align-items:center;justify-content:center;font-size:30pt;color:rgba(246,241,234,.08);}
  .plato h3{font-weight:600;font-size:11.5pt;line-height:1.15;}
  .plato p{font-size:8.4pt;color:var(--dim);margin-top:1.2mm;}
  .precios{display:flex;gap:1.8mm;margin-top:2.2mm;flex-wrap:wrap;}
  .precios span{font-size:7.8pt;border:1px solid var(--line);border-radius:1.6mm;padding:.7mm 2mm;color:var(--mute);}
  .precios b{color:var(--ink);font-weight:600;margin-left:1mm;}

  .combis{display:grid;grid-template-columns:1fr 1fr;gap:3.6mm;}
  .combi{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:3.5mm;padding:4.5mm 5mm;}
  .combi.dest{border-color:rgba(228,64,39,.6);background:linear-gradient(160deg,rgba(228,64,39,.12),var(--card) 55%);}
  .combi h3{font-size:13pt;}
  .combi > p{font-size:8.4pt;color:var(--dim);margin-top:1.4mm;}
  .filas{margin-top:3mm;display:grid;gap:1.3mm;}
  .fila{display:flex;align-items:baseline;gap:2mm;font-size:9.5pt;}
  .fila::after{content:'';order:1;flex:1;border-bottom:1px dotted var(--line);transform:translateY(-1mm);}
  .fila b{font-weight:500;order:0;}
  .fila span{order:2;font-weight:600;}
  .nota{font-size:7.8pt;color:var(--oro);margin-top:2.6mm;letter-spacing:.04em;}

  .cierre{break-inside:avoid;margin-top:4mm;display:grid;grid-template-columns:1fr auto;gap:8mm;align-items:center;
    border:1px solid var(--line);border-radius:3.5mm;padding:6mm;background:var(--bg2);}
  .cierre h2{font-size:15pt;}
  .cierre p{font-size:9.5pt;color:var(--dim);margin-top:2mm;}
  .pie{margin-top:6mm;font-size:7.5pt;color:var(--mute);line-height:1.5;}
</style>
</head>
<body>

<section class="portada">
  <div class="marca">
    <img src="../img/logo.jpg" alt="Hugo Sushi">
    <span>Carta</span>
  </div>
  <div class="titulo">
    <span class="kicker">Ushuaia · Delivery &amp; take away</span>
    <h1>El sushi del<br><em>fin del mundo.</em></h1>
    <p>Rolls, nigiris y combinados hechos en el día. Elegí lo que querés y pedilo por la web o por WhatsApp.</p>
  </div>
  <div class="arte">
    <img src="../img/hawai-smoke.jpg" alt="">
    <img src="../img/beetroot.jpg" alt="">
    <img src="../img/sweet-mango.jpg" alt="">
  </div>
  <div class="pedir">
    <div>
      <h2 class="disp">Hacé tu <em>pedido</em></h2>
      <div class="datos">
        <div>WhatsApp <b>2901 30 00 80</b></div>
        <div>Web <b>hugosushi.online</b></div>
        <div>Instagram <b>@hugo_sushi</b></div>
        <div>Pedidos hasta las <b>23 h</b></div>
      </div>
    </div>
    <div>
      <div class="qr"><canvas id="qr1"></canvas></div>
      <div class="qr-cap">Escaneá y pedí</div>
    </div>
  </div>
</section>

<main class="carta" id="carta"></main>

<script src="qr.js"></script>
<script>
/* Las secciones con los mismos títulos y textos de la página. El orden no es
   el de la página: está pensado para que las hojas se llenen (Nigiris y
   Frituras comparten una; Combinados cierra con el pedido).
   Una sección que el dueño cree desde su panel y no esté acá sale al final,
   con su nombre: la carta no esconde nada que esté a la venta. */
const SECCIONES=[
  {sec:'Hugo Bests', h:'Hugo <em>Bests</em>', p:'Los que nos hicieron famosos. Cada uno con su cubierta y su salsa — los que más se piden y los que más se sacan fotos.'},
  {sec:'Hugo Rolls', h:'Hugo <em>Rolls</em>', p:'Los clásicos de siempre, con salmón fresco y palta. Rolls sin corte si los preferís así.'},
  {sec:'Nigiris', h:'Nigiris &amp; <em>sashimi</em>', p:'La pieza sola, sin nada que la tape. Salmón rosado y langostino.'},
  {sec:['Frituras','Hot-rolls'], nombre:'Frituras', h:'Fri<em>turas</em>', p:'Lo que sale caliente de la cocina: harumakis, langostinos apanados y los hot-rolls.'},
  {sec:'Combinados', h:'Com<em>binados</em>', p:'Para compartir. Elegí el tamaño según cuántos sean — y si querés que elijamos nosotros, pedí el Omakase.', combi:true},
];
const DESTACADO=new Set(['omakase']);
const API_ORIGEN='https://api.hg-vl.com';

const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=c=>'$ '+(c/100).toLocaleString('es-AR');
const piezas=et=>{const m=/^(\d+)\s*piezas?$/i.exec(et);return m?m[1]:null;};
const corta=et=>{const pz=piezas(et);return pz?'x'+pz:et;};

function foto(i){
  const src=i.foto?(i.foto.startsWith('/')?API_ORIGEN+i.foto:i.foto):(i.imagen?'../img/'+i.imagen+'.jpg':'');
  return src?`<div class="foto"><img src="${esc(src)}" alt=""></div>`:'<div class="foto sin">鮨</div>';
}
/* La tira de precios va bajo el título solo si TODA la sección cuesta lo
   mismo; si no, cada plato lleva los suyos. Igual que en la página. */
const firma=i=>i.variantes.map(v=>v.etiqueta+'='+v.precio).join(';');
function plato(i,conPrecios){
  const pr=conPrecios?`<div class="precios">${i.variantes.map(v=>`<span>${esc(i.variantes.length===1?'':corta(v.etiqueta))}<b class="num">${fmt(v.precio)}</b></span>`).join('')}</div>`:'';
  return `<article class="plato">${foto(i)}<div><h3>${esc(i.nombre)}</h3><p>${esc(i.descripcion)}</p>${pr}</div></article>`;
}
function combi(i){
  return `<article class="combi${DESTACADO.has(i.slug)?' dest':''}">
    <h3 class="disp">${esc(i.nombre)}</h3><p>${esc(i.descripcion)}</p>
    <div class="filas">${i.variantes.map(v=>`<div class="fila"><b>${esc(v.etiqueta)}</b><span class="num">${fmt(v.precio)}</span></div>`).join('')}</div>
    ${DESTACADO.has(i.slug)?'<p class="nota">Sugerido por la casa</p>':''}
  </article>`;
}

/* Cada sección se parte en bloques —su título y sus filas de a dos— y los
   bloques se reparten en hojas A4 midiendo: si uno no entra, va a la hoja
   siguiente. Un título nunca queda solo al pie, y una sección que sigue en
   otra hoja lo dice arriba. Así la carta se acomoda sola si el dueño suma
   o saca platos. */
const deA=(l,n)=>{const r=[];for(let k=0;k<l.length;k+=n)r.push(l.slice(k,k+n));return r;};
function bloques(items){
  const porSec=new Map();
  for(const i of items){ if(!porSec.has(i.seccion)) porSec.set(i.seccion,[]); porSec.get(i.seccion).push(i); }
  const orden=SECCIONES.map(s=>({...s,secs:[].concat(s.sec),nombre:s.nombre||[].concat(s.sec)[0]}));
  for(const s of porSec.keys()) if(!orden.some(o=>o.secs.includes(s))) orden.push({secs:[s],nombre:s||'Más de la carta',h:esc(s||'Más de la carta'),p:''});
  const out=[];
  for(const s of orden){
    const l=s.secs.flatMap(x=>porSec.get(x)||[]); if(!l.length) continue;
    const igual=!s.combi&&l.every(i=>firma(i)===firma(l[0]));
    const tira=igual?`<div class="tira num">${l[0].variantes.map(v=>`${esc(corta(v.etiqueta))} · ${fmt(v.precio)}`).join(' &nbsp;·&nbsp; ')}</div>`:'';
    out.push({titulo:true,sec:s.nombre,html:`<div class="blk sec-head"><span class="kicker">Hugo Sushi</span>
      <h2 class="disp">${s.h}</h2>${s.p?`<p>${s.p}</p>`:''}${tira}</div>`});
    for(const fila of deA(l,2)) out.push({sec:s.nombre,html:s.combi
      ?`<div class="blk combis">${fila.map(combi).join('')}</div>`
      :`<div class="blk grilla">${fila.map(i=>plato(i,!igual)).join('')}</div>`});
  }
  const hoy=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  out.push({html:`<div class="blk cierre"><div><h2 class="disp">¿Ya <em>elegiste?</em></h2>
      <p>Armá tu pedido en <b>hugosushi.online</b> o escribinos por WhatsApp al <b>2901 30 00 80</b>. Delivery y take away, pedidos hasta las 23 h.</p></div>
      <div><div class="qr"><canvas id="qr2"></canvas></div><div class="qr-cap">hugosushi.online</div></div></div>
    <p class="blk pie">Imágenes ilustrativas. Precios vigentes al ${esc(hoy)}; pueden cambiar sin aviso — los del día están siempre en hugosushi.online.</p>`});
  return out;
}

function paginar(bs){
  const cont=document.getElementById('carta'); cont.innerHTML='';
  let n=1;
  const hojaVacia=()=>{const h=document.createElement('section');h.className='hoja';
    h.innerHTML='<div class="folio"></div>';cont.appendChild(h);return h;};
  const nueva=()=>{const h=hojaVacia();
    h.querySelector('.folio').innerHTML=`<span>Hugo Sushi · Ushuaia</span><span>${++n}</span>`;return h;};
  const agregar=(h,html)=>{const t=document.createElement('template');t.innerHTML=html.trim();
    const els=[...t.content.children];els.forEach(e=>h.insertBefore(e,h.querySelector('.folio')));return els;};
  const desborda=h=>h.scrollHeight>h.clientHeight+1;
  const tieneBloques=h=>!!h.querySelector('.blk');
  /* ¿Entra este grupo en una hoja vacía? Se mide en una hoja de prueba que
     después se tira, para no gastar el lugar que queda en la actual. */
  const entraSolo=g=>{const h=hojaVacia();g.forEach(x=>agregar(h,x.html));const ok=!desborda(h);h.remove();return ok;};

  // Los bloques se agrupan por sección: una sección que entra entera en una
  // hoja no se corta; si no entra en lo que queda, pasa completa a la siguiente.
  const grupos=[];
  for(const x of bs){
    if(x.titulo||!grupos.length||x.sec!==grupos[grupos.length-1].sec) grupos.push({sec:x.sec,bs:[]});
    grupos[grupos.length-1].bs.push(x);
  }
  let hoja=nueva();
  for(const g of grupos){
    if(entraSolo(g.bs)){
      const els=g.bs.flatMap(x=>agregar(hoja,x.html));
      if(desborda(hoja)&&tieneBloques(hoja)&&hoja.querySelectorAll('.blk').length>els.length){
        els.forEach(e=>e.remove()); hoja=nueva(); g.bs.forEach(x=>agregar(hoja,x.html));
      }
      continue;
    }
    // No entra ni en una hoja entera: fila por fila, sin dejar un título solo
    // al pie, y la hoja nueva dice de qué sección viene.
    for(let k=0;k<g.bs.length;k++){
      const x=g.bs[k], juntos=x.titulo&&g.bs[k+1]?[x,g.bs[k+1]]:[x];
      const els=juntos.flatMap(y=>agregar(hoja,y.html));
      if(desborda(hoja)&&hoja.querySelectorAll('.blk').length>els.length){
        els.forEach(e=>e.remove());
        hoja=nueva();
        if(!x.titulo&&x.sec) agregar(hoja,`<div class="blk sigue">${esc(x.sec)} · sigue</div>`);
        juntos.forEach(y=>agregar(hoja,y.html));
      }
      k+=juntos.length-1;
    }
  }
}

function pintar(items){
  paginar(bloques(items));
  for(const id of ['qr1','qr2']){const c=document.getElementById(id);if(c)QR.pintar(c,'https://hugosushi.online/',8);}
}

pintar(window.CARTA||[]);
</script>
</body>
</html>
