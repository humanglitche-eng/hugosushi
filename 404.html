<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · HUGO SUSHI</title>
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#0a0908;color:#f6f1ea;font:400 17px/1.55 'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:dark;}
  a{color:inherit}
  header{padding:20px 16px;border-bottom:1px solid rgba(246,241,234,.24)}
  header a{font:600 15px/1 'Russo One',system-ui,sans-serif;letter-spacing:.04em;text-decoration:none}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:640px;margin:0 auto;padding:48px 16px 64px}
  .num{display:block;font:400 clamp(96px,28vw,180px)/.85 'Russo One',system-ui,sans-serif;color:#f0c36a;letter-spacing:-.02em;margin:0 0 20px}
  h1{font:600 clamp(28px,7vw,44px)/1.1 'Russo One',system-ui,sans-serif;margin:0 0 14px;text-wrap:balance}
  p{margin:0 0 10px;color:rgba(246,241,234,.72);max-width:46ch}
  .sub{font-size:15px}
  .acciones{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:999px;font:500 16px/1.2 'Outfit',system-ui,sans-serif;text-decoration:none;border:1px solid #f0c36a;transition:transform .15s ease,background-color .15s ease}
  .btn.uno{background:#f0c36a;color:#0a0908}
  .btn.dos{border-color:rgba(246,241,234,.24);color:#f6f1ea}
  .btn:hover{transform:translateY(-1px)}
  .btn:focus-visible{outline:3px solid #f0c36a;outline-offset:3px}
  .btn.uno:focus-visible{outline-color:#f6f1ea}
  footer{padding:18px 16px;border-top:1px solid rgba(246,241,234,.24);font:400 13px/1.4 'Outfit',system-ui,sans-serif;color:rgba(246,241,234,.72)}
  @media (max-width:420px){.btn{flex:1 1 100%}}
</style>
</head>
<body>
<header><a href="https://hugosushi.online/">HUGO SUSHI</a></header>
<main>
  <span class="num" aria-hidden="true">404</span>
  <h1>Este roll no está en la carta</h1>
  <p>La página que buscás no existe o la movimos. La carta completa sigue en el inicio, con pedidos hasta las 23 h.</p>
  <div class="acciones">
    <a class="btn uno" href="https://hugosushi.online/">Ver la carta</a>
    <a class="btn dos" href="https://wa.me/5492901300080" rel="noopener">Pedir por WhatsApp</a>
  </div>
</main>
<footer>Error 404 · hugosushi.online</footer>
</body>
</html>
